name: ZForge Quality Gate
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# One active validation per PR; newer commits supersede stale in-progress runs.
concurrency:
  group: zforge-quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run dependency-free unit tests
        run: npm test
      - name: Validate cloud execution entrypoints
        run: |
          node --check src/core/cloud-task-contract.js
          node --check src/runtime/server.js
          node --check scripts/run-cloud-task.mjs
          node --check scripts/post-cloud-task-result.mjs
          node --check assets/cloud-execution.js
      - name: Validate offline KemeTone Python adapter syntax
        run: python3 -m py_compile scripts/kemetone-inference.py

  browser-smoke:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install pinned Playwright runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run BLACK VANTA browser smoke tests
        run: node scripts/browser-smoke.mjs
