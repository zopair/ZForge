name: Daily Executive Summary & IP Proof

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-research-brief-main
  cancel-in-progress: false

jobs:
  publish-daily-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compile the last 24 hours and create SHA-256 proof
        shell: bash
        run: |
          set -euo pipefail

          timestamp="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          window_start="$(date -u -d '24 hours ago' '+%Y-%m-%d %H:%M:%S UTC')"

          changed_files="$(git log --since='24 hours ago' --format= --name-only -- research_logs blueprints | sed '/^[[:space:]]*$/d' | sort -u)"
          research_files=()
          blueprint_files=()
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              research_logs/*) research_files+=("$file") ;;
              blueprints/*)
                [[ "$file" == "blueprints/README.md" ]] || blueprint_files+=("$file")
                ;;
            esac
          done <<< "$changed_files"

          research_count="${#research_files[@]}"
          if (( research_count > 0 )); then
            ip_hash="$(
              for file in "${research_files[@]}"; do
                if [[ -f "$file" ]]; then
                  sha256sum "$file"
                else
                  printf 'DELETED %s\\n' "$file"
                fi
              done | sha256sum | awk '{print $1}'
            )"
          else
            ip_hash="$(printf '' | sha256sum | awk '{print $1}')"
          fi

          {
            echo "# 📊 Daily Research Brief"
            echo
            echo "- **Generated:** $timestamp"
            echo "- **Reporting window:** $window_start — $timestamp"
            echo
            echo "## Executive Summary"
            echo
            echo "### New APIs, tools, and models discovered"
            if (( research_count > 0 )); then
              matches="$(
                for file in "${research_files[@]}"; do
                  [[ -f "$file" ]] && grep -hE '^[[:space:]]*[-*] (Tool|API|Model):' "$file" || true
                done | grep -v '<!--' | sort -u || true
              )"
              if [[ -n "$matches" ]]; then
                printf '%s\\n' "$matches"
              else
                echo "- Research files changed, but no structured Tool/API/Model entries were found."
              fi
            else
              echo "- No research-log updates were committed during this 24-hour window."
            fi
            echo
            echo "### Theoretical blueprints and architectures drafted"
            if (( ${#blueprint_files[@]} > 0 )); then
              for file in "${blueprint_files[@]}"; do
                [[ -f "$file" ]] || continue
                echo "- `$file`"
                grep -E '^#{1,3} ' "$file" | head -n 5 | sed 's/^/  /' || true
              done
            else
              echo "- No blueprint files were changed during this 24-hour window."
            fi
            echo
            echo "### Identified integration opportunities"
            if (( ${#research_files[@]} + ${#blueprint_files[@]} > 0 )); then
              matches="$(
                for file in "${research_files[@]}" "${blueprint_files[@]}"; do
                  [[ -f "$file" ]] && grep -hEi '^[[:space:]]*[-*] (Integration opportunity|Integration|Composition):' "$file" || true
                done | grep -v '<!--' | sort -u || true
              )"
              if [[ -n "$matches" ]]; then
                printf '%s\\n' "$matches"
              else
                echo "- No structured integration-opportunity entries were found in the updated files."
              fi
            else
              echo "- No new integration opportunities were recorded in this reporting window."
            fi
            echo
            echo "## Cryptographic IP Proof"
            echo
            echo "- **Algorithm:** SHA-256"
            echo "- **Research-log files included:** $research_count"
            echo "- **Digest:** `$ip_hash`"
            echo "- **Scope:** SHA-256 over the sorted per-file SHA-256 manifest of research-log files committed in the reporting window. An empty-set digest means no research-log files changed."
            echo
            echo "## IP & Copyright"
            echo
            echo "> © 2026 ZForge. All Intellectual Property Rights Reserved. The architectural blueprints, tool syntheses, and research logs documented herein are the exclusive proprietary intellectual property of the repository owner. Unauthorized execution, commercial replication, or derivation of these blueprints is strictly prohibited."
          } > DAILY_BRIEF.md

      - name: Commit and publish the brief to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- DAILY_BRIEF.md; then
            echo "Daily brief is unchanged; no commit is needed."
            exit 0
          fi
          git add DAILY_BRIEF.md
          git commit -m "docs: publish daily research brief and IP digest"
          git push origin HEAD:main
