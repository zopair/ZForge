name: ZForge Cloud Execution

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: zforge-cloud-task-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.event.issue.user.login == 'zopair' && startsWith(github.event.issue.title, '[ZForge Cloud Task]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout ZForge
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate ZForge and cloud task contract
        run: npm test

      - name: Install Ollama on the ephemeral worker
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > "${RUNNER_TEMP}/ollama.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:1.5b

      - name: Execute request through the ZForge Chief Agent
        id: cloud-task
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          ZFORGE_CLOUD_OUTPUT_DIR: ${{ runner.temp }}/zforge-cloud-output
        run: node scripts/run-cloud-task.mjs

      - name: Upload execution report and generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zforge-cloud-task-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/zforge-cloud-output/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish result to the originating issue
        if: always()
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZFORGE_CLOUD_RESULT_FILE: ${{ runner.temp }}/zforge-cloud-output/cloud-task-result.json
        run: node scripts/post-cloud-task-result.mjs

      - name: Fail the workflow when the agent did not verify completion
        if: steps.cloud-task.outcome == 'failure'
        run: exit 1
